name: Goop Fishing CI

on:
  push:
    branches:
      - main
      - feature/species-aware-wildlife
      - feature/mainline-session-telemetry-clean
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: goop-fishing-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check JavaScript syntax
        run: npm run check

      - name: Run regression tests
        run: npm test

      - name: Generate current-source economy audit
        run: npm run economy:audit

      - name: Install pinned Playwright
        run: npm install --no-save --no-package-lock playwright@1.56.1

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run current-mainline browser smoke tests
        run: npm run test:browser

      - name: Run release-readiness browser checks
        run: npm run test:release
